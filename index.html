<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMEF Cel. Aureliano Junqueira Franco</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px 35px;
            max-width: 640px;
            width: 100%;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* ---- CABEÇALHO ---- */
        .header {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 3px solid #4299e1;
        }

        .header .logo {
            font-size: 42px;
            margin-bottom: 8px;
            display: block;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1a365d;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .header h1 span {
            display: block;
            font-size: 18px;
            font-weight: 400;
            color: #4a5568;
            margin-top: 4px;
            letter-spacing: 0;
        }

        .header .sub {
            font-size: 15px;
            color: #718096;
            margin-top: 6px;
            font-weight: 500;
        }

        /* ---- BOTÕES ---- */
        .botoes {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 10px 0 20px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            color: white;
            background: #4299e1;
            box-shadow: 0 4px 12px rgba(66, 153, 225, 0.25);
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(66, 153, 225, 0.35);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Efeito de loading nos botões */
        .btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .btn.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            right: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-consultar {
            background: #48bb78;
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.30);
        }
        .btn-consultar:hover {
            background: #38a169;
            box-shadow: 0 8px 24px rgba(72, 187, 120, 0.40);
        }

        .btn-editar {
            background: #ed8936;
            box-shadow: 0 4px 12px rgba(237, 137, 54, 0.30);
        }
        .btn-editar:hover {
            background: #dd6b20;
            box-shadow: 0 8px 24px rgba(237, 137, 54, 0.40);
        }

        .btn-inserir {
            background: #9f7aea;
            box-shadow: 0 4px 12px rgba(159, 122, 234, 0.30);
        }
        .btn-inserir:hover {
            background: #805ad5;
            box-shadow: 0 8px 24px rgba(159, 122, 234, 0.40);
        }

        .btn .icone {
            font-size: 24px;
            line-height: 1;
        }

        .btn .label {
            flex: 1;
            text-align: left;
        }

        .btn .badge {
            font-size: 13px;
            background: rgba(255, 255, 255, 0.20);
            padding: 3px 12px;
            border-radius: 20px;
            font-weight: 400;
        }

        /* ---- RODAPÉ ---- */
        .footer {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
            font-size: 14px;
            color: #a0aec0;
            letter-spacing: 0.3px;
        }

        .footer strong {
            color: #4a5568;
            font-weight: 600;
        }

        .footer .ano {
            color: #718096;
        }

        /* ---- LOADING GLOBAL ---- */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            flex-direction: column;
            backdrop-filter: blur(4px);
        }

        #loading-overlay .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255, 255, 255, 0.1);
            border-top: 6px solid #4299e1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        #loading-overlay .message {
            color: white;
            margin-top: 25px;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        #loading-overlay .sub-message {
            color: rgba(255, 255, 255, 0.7);
            margin-top: 8px;
            font-size: 14px;
        }

        /* ---- RESPONSIVO ---- */
        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            .header h1 {
                font-size: 21px;
            }
            .header h1 span {
                font-size: 15px;
            }
            .btn {
                font-size: 16px;
                padding: 15px 18px;
            }
            .btn .icone {
                font-size: 20px;
            }
            .btn .badge {
                font-size: 11px;
                padding: 2px 10px;
            }
            #loading-overlay .spinner {
                width: 40px;
                height: 40px;
                border-width: 4px;
            }
            #loading-overlay .message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== LOADING OVERLAY ===== -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="message" id="loading-message">Processando...</div>
        <div class="sub-message" id="loading-submessage">Aguarde um momento</div>
    </div>

    <div class="container">

        <!-- ===== CABEÇALHO ===== -->
        <div class="header">
            <span class="logo">🏫</span>
            <h1>
                EMEF Cel. Aureliano Junqueira Franco
                <span>Secretaria Escolar</span>
            </h1>
            <div class="sub">Sistema de Contatos</div>
        </div>

        <!-- ===== BOTÕES ===== -->
        <div class="botoes">

            <!-- Consultar Contatos -->
            <a href="consulta.html" class="btn btn-consultar" data-loading="Carregando consulta...">
                <span class="icone">🔍</span>
                <span class="label">Consultar Contatos</span>
                <span class="badge">visualizar</span>
            </a>

            <!-- Editar Contatos -->
            <a href="editarcontato.html" class="btn btn-editar" data-loading="Carregando edição...">
                <span class="icone">✏️</span>
                <span class="label">Editar Contatos</span>
                <span class="badge">alterar</span>
            </a>

            <!-- Inserir Novo Contato -->
            <a href="novoaluno.html" class="btn btn-inserir" data-loading="Preparando cadastro...">
                <span class="icone">➕</span>
                <span class="label">Inserir Novo Aluno</span>
                <span class="badge">adicionar</span>
            </a>

        </div>

        <!-- ===== RODAPÉ ===== -->
        <div class="footer">
            Desenvolvido por <strong>Josué Santos</strong> <span class="ano">2026</span>
        </div>

    </div>

    <!-- ===== SCRIPTS ===== -->
    <!-- Primeiro carrega o sistema de sessão com loading -->
    <script src="sessao.js"></script>
    
    <!-- Script específico para esta página -->
    <script>
        (function() {
            'use strict';

            // ===== FUNÇÕES DE LOADING =====
            function showLoading(message = 'Processando...', subMessage = 'Aguarde um momento') {
                const overlay = document.getElementById('loading-overlay');
                const msgElement = document.getElementById('loading-message');
                const subMsgElement = document.getElementById('loading-submessage');
                
                if (msgElement) msgElement.textContent = message;
                if (subMsgElement) subMsgElement.textContent = subMessage;
                if (overlay) overlay.style.display = 'flex';
            }

            function hideLoading() {
                const overlay = document.getElementById('loading-overlay');
                if (overlay) overlay.style.display = 'none';
            }

            // ===== CONFIGURA BOTÕES =====
            function configurarBotoes() {
                const botoes = document.querySelectorAll('.btn[href]');
                
                botoes.forEach(botao => {
                    botao.addEventListener('click', function(e) {
                        const mensagem = this.dataset.loading || 'Carregando página...';
                        
                        // Mostra loading
                        showLoading(mensagem, 'Redirecionando...');
                        
                        // Adiciona classe de loading no botão
                        this.classList.add('loading');
                        
                        // Permite o redirecionamento normal
                        // O loading será escondido quando a nova página carregar
                    });
                });
            }

            // ===== INICIALIZA =====
            document.addEventListener('DOMContentLoaded', function() {
                configurarBotoes();
                
                // Se houver parâmetro de timeout na URL, mostra mensagem
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('timeout') === '1') {
                    // Mostra mensagem de sessão expirada (opcional)
                    console.log('Sessão expirada');
                }
            });

            // Expõe funções globalmente para uso em outras páginas
            window.loading = {
                show: showLoading,
                hide: hideLoading
            };

            // Esconde loading quando a página carregar completamente
            window.addEventListener('load', function() {
                hideLoading();
                
                // Remove classe de loading de todos os botões
                document.querySelectorAll('.btn.loading').forEach(btn => {
                    btn.classList.remove('loading');
                });
            });

        })();
    </script>

</body>
</html>
